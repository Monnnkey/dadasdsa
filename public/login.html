<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zaloguj się</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Zaloguj się</h1>
    <p class="subtitle">Podaj login i hasło.</p>

    <form class="signup">
      <div class="field">
        <label>
          Login
          <input class="login" type="text" name="login" autocomplete="username"
                 placeholder="Twój login" required>
        </label>
      </div>

      <div class="field">
        <label>
          Hasło
          <div class="pw-wrap">
            <input class="password" type="password" name="password" autocomplete="current-password"
                   placeholder="Twoje hasło" required>
            <button type="button" class="toggle">Pokaż</button>
          </div>
        </label>
      </div>

      <button type="submit" class="submit">Zaloguj się</button>
      <div class="error" style="display: none;">Nieprawidłowy login lub hasło.</div>
    </form>

    <p class="subtitle" style="margin:16px 0 0">Nie masz konta? <a href="panel.html">Zarejestruj się</a></p>
  </main>

  <script src="login.js"></script>
</body>
</html>
